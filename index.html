<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JDS</title>
<meta name="theme-color" content="#0d0f1a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JDS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --fond: #0d0f1a;
    --texte: #e8e9f0;
    --discret: #8e93ab;
    --papier: #f3efe4;
    --encre: #23242d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); }
  body {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex; flex-direction: column; min-height: 100vh; padding: 28px 20px;
  }
  header { margin-bottom: 28px; }
  h1 { font-size: 2.4rem; font-weight: 400; letter-spacing: .02em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--discret); font-size: 1rem; }
  main { display: grid; gap: 16px; max-width: 760px; width: 100%; }
  @media (min-width: 640px) { main { grid-template-columns: 1fr 1fr; } }
  a.appli {
    display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 190px; padding: 20px; border-radius: 18px;
    text-decoration: none; position: relative; overflow: hidden;
  }
  a.appli:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  a.appli h2 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 400; }
  a.appli span { font-size: .95rem; }
  .voidfall { background: #161a2e; color: var(--texte); border: 1px solid #2b3050; }
  .voidfall span { color: var(--discret); }
  .voidfall img { position: absolute; top: 18px; left: 20px; width: 56px; height: 56px; border-radius: 12px; }
  .origami { background: var(--papier); color: var(--encre); }
  .origami span { color: #5b5c66; }
  .origami::before {
    content: ""; position: absolute; top: 0; right: 0; width: 70px; height: 70px;
    background: linear-gradient(225deg, var(--fond) 50%, #d9d3c0 50%);
    border-bottom-left-radius: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>JDS</h1>
  <p>Choisissez une application.</p>
</header>
<main>
  <a class="appli voidfall" href="voidfall/">
    <img src="voidfall/icons/icon-192.png" alt="">
    <h2>Voidfall Companion</h2>
    <span>Le compagnon de partie pour Voidfall.</span>
  </a>
  <a class="appli origami" href="origami/webapp/">
    <h2>JDS Origami</h2>
    <span>Patrons à imprimer pour boîtes en origami.</span>
  </a>
</main>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(function () {});
  }
</script>
</body>
</html>
